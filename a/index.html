<!DOCTYPE html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dropy.az</title>
    <meta property="og:title" content="Dropy.az — endirimlər bir yerdə" />
    <meta property="og:image" content="https://dropy.az/assets/icon.png" />
    <link rel="icon" href="/assets/icon.png" />
    <link rel="stylesheet" href="/assets/seo.css" />
    <script src="/assets/go.js"></script>
    <script>
      // Links shared from the app (dropy.az/a/?k=<deal>|m=<store>, invites
      // dropy.az/a/?r=<code>). With Dropy.az installed, App Links / Universal
      // Links open the app and this page never loads. Without it, go.js counts
      // the invite and sends the phone to its store.
      (function () {
        var q = new URLSearchParams(location.search);
        dropyGo(q.get("k") ? "deal" : q.get("m") ? "store" : "invite");
      })();
    </script>
  </head>
  <body>
    <main class="wrap">
      <h1>Bu endirim Dropy.az tətbiqindədir</h1>
      <p class="lead">Tətbiqi yüklə — mağazaların bütün endirimləri bir yerdə.</p>
      <p>
        <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=az.endirim.aqreqatoru">Google Play-dən yüklə</a>
        <a class="btn" id="ios" href="https://apps.apple.com/az/app/id6819821532">App Store-dan yüklə</a>
      </p>
      <p><a href="/endirimler/">Bu günün endirimlərinə bax →</a></p>
    </main>
  </body>
</html>
