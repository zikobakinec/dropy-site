name: Refresh discount pages

# Rebuilds /endirimler/, /magaza/*, /magazalar/ and sitemap.xml from the live
# feed (seo/generate.mjs). Runs after each ingestion: the GitHub cron at 10:00
# Baku and the laptop task at 22:00 Baku.
on:
  schedule:
    - cron: "30 7 * * *"   # 11:30 Baku
    - cron: "30 18 * * *"  # 22:30 Baku
    # Market catalogs are read 6 times a day (market-catalogs.yml in the app
    # repo, :41 past 04/09/12/15/18/21 UTC); the jurnal pages follow ~30 min
    # later so the site shows the same products as the app (user, 2026-11-28).
    - cron: "15 5,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test seo/generate.test.mjs
      - run: node seo/generate.mjs
        env:
          # Market catalog pages (/endirim-jurnali/) read the public anon RPCs;
          # without these two secrets the step still runs and skips them.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Commit if anything changed
        run: |
          git config user.name "dropy-bot"
          git config user.email "support@dropy.az"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh discount pages ($(date -u +%Y-%m-%d))"
          git push
